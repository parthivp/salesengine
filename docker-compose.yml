name: salesengine

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: salesengine
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-salesengine}
      POSTGRES_DB: salesengine
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U salesengine -d salesengine']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory-policy noeviction
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  # Applies pending migrations, provisions the runtime role, and verifies that
  # row-level security covers every tenant-scoped table — then exits. App and
  # worker wait for it to succeed, so a missing RLS policy fails the deploy
  # instead of silently shipping a table one tenant can read from another.
  #
  # Runs as the owner role, because it administers roles and schema.
  migrate:
    build:
      context: .
      target: runner
    command:
      - sh
      - -c
      - npx prisma migrate deploy && npx tsx scripts/provision-db.ts
    env_file: .env
    environment:
      DATABASE_URL: postgresql://salesengine:${POSTGRES_PASSWORD:-salesengine}@postgres:5432/salesengine?schema=public
      DIRECT_DATABASE_URL: postgresql://salesengine:${POSTGRES_PASSWORD:-salesengine}@postgres:5432/salesengine?schema=public
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env — it is the runtime database password}
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  app:
    build:
      context: .
      target: runner
    command: ['node', 'server.js']
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      # The RESTRICTED role, deliberately. Row-level security does not apply to
      # the owner, so running the app as the owner turns tenant isolation off
      # entirely — with every application-level check still looking correct.
      DATABASE_URL: postgresql://salesengine_app:${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env}@postgres:5432/salesengine?schema=public
      # The app also needs the owner connection. `prismaAdmin` uses it for the
      # paths that are legitimately cross-tenant or un-scoped: sessions (no
      # tenantId, so no policy applies), the tracking and capture endpoints
      # (which run before any tenant context exists), and the platform view.
      # Without this it inherits localhost from .env and nobody can even log in.
      DIRECT_DATABASE_URL: postgresql://salesengine:${POSTGRES_PASSWORD:-salesengine}@postgres:5432/salesengine?schema=public
      REDIS_URL: redis://redis:6379
      PORT: '3000'
      # Prefer IPv4 when resolving.
      #
      # Microsoft's endpoints (login.microsoftonline.com, graph.microsoft.com)
      # publish AAAA records. Node 18+ returns addresses in resolver order rather
      # than IPv4-first, and Docker Desktop gives containers no IPv6 route by
      # default — so the first connection attempt goes to an IPv6 address that
      # cannot be reached and fails with ENETUNREACH, surfaced as a bare
      # "fetch failed". Nothing about the credentials is wrong and nothing in the
      # error says so.
      NODE_OPTIONS: --dns-result-order=ipv4first
    ports:
      - '${APP_PORT:-3000}:3000'
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # The sequence scheduler, email sender, CRM sync and enrichment all live here.
  # Deliberately a separate process: these are long-running jobs that must not
  # share a request lifecycle.
  worker:
    build:
      context: .
      target: runner
    command: ['node', '--import', 'tsx', 'src/worker/index.ts']
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      # Restricted role here too — the worker touches the same tenant data.
      DATABASE_URL: postgresql://salesengine_app:${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env}@postgres:5432/salesengine?schema=public
      # The scheduler is cross-tenant by nature — it finds every due enrollment
      # and every mailbox to poll, across all workspaces.
      DIRECT_DATABASE_URL: postgresql://salesengine:${POSTGRES_PASSWORD:-salesengine}@postgres:5432/salesengine?schema=public
      REDIS_URL: redis://redis:6379
      # Prefer IPv4 when resolving.
      #
      # Microsoft's endpoints (login.microsoftonline.com, graph.microsoft.com)
      # publish AAAA records. Node 18+ returns addresses in resolver order rather
      # than IPv4-first, and Docker Desktop gives containers no IPv6 route by
      # default — so the first connection attempt goes to an IPv6 address that
      # cannot be reached and fails with ENETUNREACH, surfaced as a bare
      # "fetch failed". Nothing about the credentials is wrong and nothing in the
      # error says so.
      NODE_OPTIONS: --dns-result-order=ipv4first
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
