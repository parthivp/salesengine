<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <style>
    body { font: 13px/1.5 -apple-system, "Segoe UI", Roboto, sans-serif; width: 280px; margin: 0; padding: 14px; color: #0f172a; }
    h1 { font-size: 14px; margin: 0 0 4px; }
    p { margin: 0 0 10px; color: #475569; }
    label { display: block; font-size: 12px; color: #475569; margin-bottom: 4px; }
    input { width: 100%; box-sizing: border-box; padding: 7px 8px; border: 1px solid #e2e8f0; border-radius: 8px; font: inherit; }
    button { width: 100%; margin-top: 10px; padding: 8px; background: #2563eb; color: #fff; border: 0; border-radius: 8px; font-weight: 500; cursor: pointer; }
    .status { margin-top: 8px; font-size: 12px; }
    .note { font-size: 11px; color: #64748b; margin-top: 12px; }
  </style>
</head>
<body>
  <h1>SalesEngine queue</h1>
  <p>The panel appears on linkedin.com. This only sets where to fetch your queue from.</p>
  <label for="base">SalesEngine URL</label>
  <input id="base" type="url" placeholder="http://localhost:3000" />
  <button id="save">Save</button>
  <p class="status" id="status"></p>
  <p class="note">
    This extension never clicks Send and never scrapes. It fills the note field; you send it.
  </p>
  <script src="popup.js"></script>
</body>
</html>
